schema_version: "1.0"
ui:
  scale: 1.3
  base_font_point_size: 16
  heading_font_point_size: 18
  side_panel_width: 410
autosave:
  interval_seconds: 60
  command_interval: 10
reference:
  opacity: 0.12
  wireframe: false
  point_size: 2.0
  point_cloud_visible: true
  proxy_mesh_visible: true
  pgsr_output_mesh_visible: true
navigation:
  initial_camera:
    mode: origin
    eye_offset_m: [3.0, 3.0, 2.2]
    target_offset_m: [0.5, 0.5, 0.5]
  fps:
    enabled: true
    mouse_sensitivity_deg_per_pixel: 0.15
    maximum_pitch_deg: 85.0
    movement_speed_mps: 1.5
    sprint_multiplier: 3.0
    max_frame_delta_seconds: 0.05
    horizontal_only: false
external_commands:
  sionna_environment:
    type: conda
    name: sionna
