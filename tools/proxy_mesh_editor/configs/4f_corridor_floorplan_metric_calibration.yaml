schema_version: "1.0"

metric_calibration:
  status: provisional
  confidence: medium

  source:
    envelope_json: outputs/proxy_mesh/4f_corridor/floorplan_aligned/room_envelope/room_envelope.json
    envelope_obj: outputs/proxy_mesh/4f_corridor/floorplan_aligned/room_envelope/room_envelope.obj

  scale:
    method: weighted_least_squares
    uniform_scale_only: true
    references:
      - name: floorplan_bottom_corridor_length
        scene_distance: 7.948304790108382
        real_distance_m: 11.80
        source: IMG_2810_annotated_floorplan
        confidence: medium
        weight: 2.0
        notes: "도면의 (0,0)에서 오른쪽 외벽까지 표시된 11 m 80 cm."
      - name: floorplan_top_corridor_length
        scene_distance: 4.351360080008487
        real_distance_m: 6.46
        source: IMG_2810_annotated_floorplan
        confidence: medium
        weight: 1.0
        notes: "도면의 x=5.34 m 꺾임부터 x=11.80 m 외벽까지 표시된 6 m 46 cm."
      - name: floorplan_bottom_corridor_width
        scene_distance: 5.051888637780751
        real_distance_m: 7.50
        source: IMG_2810_annotated_floorplan
        confidence: medium
        weight: 1.0
        notes: "도면의 원점에서 아래 복도 위쪽 경계까지 표시된 7 m 50 cm."

  coordinate_frame:
    source_up:
      type: envelope_scene_up_vector
    target_up: [0.0, 0.0, 1.0]
    origin:
      type: envelope_bottom_corner
      corner_index: 0
    x_axis:
      type: envelope_bottom_edge
      start_corner: 3
      end_corner: 4
      remove_up_component: true
    handedness: right
    require_proper_rotation: true

  validation:
    maximum_reference_relative_error: 0.01
    maximum_reference_spread_warning: 0.005
    maximum_reference_spread_failure: 0.02
    maximum_rotation_determinant_error: 1.0e-8
    maximum_orthogonality_error: 1.0e-8
    maximum_axis_alignment_error: 1.0e-8
    maximum_origin_error: 1.0e-8
    maximum_round_trip_error: 1.0e-8
    maximum_plane_residual: 1.0e-7
    topology_must_match_source: true

  output:
    write_obj: true
    write_ply: true
    write_metric_metadata: true
    write_axis_preview: true
