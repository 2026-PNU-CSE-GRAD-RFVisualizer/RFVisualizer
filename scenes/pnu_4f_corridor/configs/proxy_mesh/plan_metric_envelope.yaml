schema_version: "1.0"

# 사용자 도면은 붉은/파란 복도의 위상만 정하고, 실제 경계 좌표는 PGSR
# 수직면 분포에서 보정한 최종 편집기용 Metric Proxy다. 바닥 z=0,
# 천장 z=2.614111514 m이며 TX/RX는 도면의 +X/+Y와 같은 양수 좌표를 쓴다.
room_envelope:
  enabled: true

  floor:
    candidate_id: metric_floor

  ceiling:
    candidate_id: metric_ceiling

  ordered_walls:
    - candidate_id: metric_y_min
    - candidate_id: metric_x_max
    - candidate_id: metric_y_max
    - candidate_id: metric_x_red_outer
    - candidate_id: metric_y_red_inner
    - candidate_id: metric_x_blue_inner
    - candidate_id: metric_y_connector_bottom
    - candidate_id: metric_x_min_lower

  interior_point: null

  validation:
    floor_ceiling_max_angle_deg: 1.0e-6
    wall_max_up_dot: 1.0e-8
    adjacent_wall_min_angle_deg: 45.0
    plane_residual_tolerance: 1.0e-8
    vertex_merge_tolerance: 1.0e-8
    intersection_max_condition_number: 1.0e6
    minimum_height: 2.0
    minimum_height_ratio: 0.0
    require_simple_polygon: true
    require_closed_manifold: true

  output:
    normal_orientation: outward
    write_individual_objects: true
    write_preview_ply: true
