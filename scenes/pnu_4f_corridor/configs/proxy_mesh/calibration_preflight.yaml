schema_version: "1.0"

calibration_preflight:
  status: provisional
  confidence: low

  source:
    envelope_json: scenes/pnu_classroom/proxy_mesh/room_envelope/room_envelope.json
    envelope_obj: scenes/pnu_classroom/proxy_mesh/room_envelope/room_envelope.obj

  scale_references:
    - name: two_door_total_width
      scene_distance: 1.351458
      assumed_real_distance_m: 2.0
      source: estimated_from_photo
      confidence: low
      weight: 1.0
      notes: "두 문 전체 폭. 문틀 및 중앙 간격 포함 여부를 학교 방문 후 확인해야 함."

    - name: door_height
      scene_distance: 1.370173
      assumed_real_distance_m: 2.2
      source: estimated_from_photo
      confidence: low
      weight: 1.0
      notes: "바닥부터 문 상단 또는 문틀 상단 중 어느 구간인지 학교 방문 후 확인해야 함."

  scale_analysis:
    supported_estimators:
      - arithmetic_mean_of_ratios
      - weighted_mean_of_ratios
      - weighted_least_squares
      - median_of_ratios
    recommended_estimator: weighted_least_squares
    uniform_scale_only: true
    warning_relative_spread: 0.05
    failure_relative_spread: 0.20

  orientation:
    source_up:
      type: envelope_scene_up_vector
    target_up: [0.0, 0.0, 1.0]
    require_proper_rotation: true
    minimum_rotation_determinant: 0.999999
    maximum_rotation_determinant: 1.000001

  frame_candidates:
    origin_methods:
      - lowest_bottom_corner
      - explicit_bottom_corner
    default_origin_method: lowest_bottom_corner
    x_axis_methods:
      - longest_horizontal_envelope_edge
      - explicit_envelope_edge
    default_x_axis_method: longest_horizontal_envelope_edge
    remove_up_component_from_x_axis: true

  validation:
    minimum_positive_height: 1.0e-6
    maximum_up_alignment_error: 1.0e-8
    maximum_orthogonality_error: 1.0e-8
    maximum_round_trip_error: 1.0e-8

  preview:
    write_rotation_only_obj: true
    write_rotation_only_ply: true
    write_axis_gizmo_ply: true
