schema_version: "1.0"

# PGSR 바닥 지지점, 자동 벽 후보, 카메라 이동 경로를 함께 대조해 만든
# 4층 복도용 L자 외곽이다. 기존 4-wall room_envelope는 실제 복도를
# 대각선으로 가로지르므로 보존만 하고 편집기 입력에는 사용하지 않는다.
#
# manual_wall_candidates.json의 벽은 다음 장면 구역을 순서대로 감싼다.
#   1) 촬영 시작부의 좁은 직선 복도
#   2) 꺾인 뒤 이어지는 긴 복도
#   3) 엘리베이터 앞의 넓어진 로비
# 시작부 cap과 좁은 복도 안쪽 경계는 자동 RANSAC 후보가 없어 카메라
# 경로와 바닥 지지점으로 보완했다. 따라서 실제 도면 정렬 전까지는
# provisional/low-confidence 형상으로 취급한다.
room_envelope:
  enabled: true

  floor:
    candidate_id: plane_000

  ceiling:
    candidate_id: plane_001

  ordered_walls:
    - candidate_id: corridor_b_outer
    - candidate_id: corridor_a_outer
    - candidate_id: lobby_b_outer
    - candidate_id: lobby_a_inner
    - candidate_id: lobby_b_inner
    - candidate_id: corridor_a_inner
    - candidate_id: entrance_b_inner
    - candidate_id: entrance_a_cap

  interior_point: null

  validation:
    floor_ceiling_max_angle_deg: 10.0
    wall_max_up_dot: 1.0e-8
    adjacent_wall_min_angle_deg: 45.0
    plane_residual_tolerance: 1.0e-6
    vertex_merge_tolerance: 1.0e-6
    intersection_max_condition_number: 1.0e8
    minimum_height: null
    minimum_height_ratio: 0.05
    require_simple_polygon: true
    require_closed_manifold: true

  output:
    normal_orientation: outward
    write_individual_objects: true
    write_preview_ply: true
