id: classroom_20260723
kind: experiment_session
parent_room: pnu_classroom

# Duplicated from the parent room's scene.yaml — only one dated session exists today,
# so no inheritance mechanism is implemented. Add one if a second session makes this painful.
pgsr:
  point_cloud: PGSR/output/pnu_classroom/point_cloud/iteration_30000/point_cloud.ply
  mesh: PGSR/output/pnu_classroom/mesh/tsdf_fusion_post.ply

tools:
  rf_experiment:
