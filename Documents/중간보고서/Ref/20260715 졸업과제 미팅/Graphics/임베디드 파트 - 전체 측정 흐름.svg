  <text x="1072" y="294" text-anchor="middle" class="kr box-subtitle">Bridge</text>

  <g transform="translate(1072 420)" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-69" y="-50" width="138" height="100" rx="12"/>
    <path d="M-40 -16 L-16 0 L-40 16"/>
    <line x1="0" y1="18" x2="40" y2="18"/>
  </g>

  <circle cx="973" cy="515" r="5" fill="#7c3aed"/>
  <text x="990" y="522" class="kr body">시리얼 JSON 정규화</text>
  <circle cx="973" cy="564" r="5" fill="#7c3aed"/>
  <text x="990" y="571" class="kr body">노드 ID 표준화</text>
  <circle cx="973" cy="613" r="5" fill="#7c3aed"/>
  <text x="990" y="620" class="kr body">설치 좌표 결합</text>
  <circle cx="973" cy="662" r="5" fill="#7c3aed"/>
  <text x="990" y="669" class="kr body">잘못된 값 제외</text>
  <rect x="973" y="720" width="199" height="45" rx="12" fill="#ede9fe"/>
  <text x="1072" y="749" text-anchor="middle" class="kr output-label" fill="#6d28d9">출력: MQTT 메시지</text>

  <!-- 5. Backend -->
  <g filter="url(#shadow)">
    <rect x="1240" y="215" width="255" height="580" rx="24" fill="#ffffff"/>
    <path d="M1240 239 Q1240 215 1264 215 H1471 Q1495 215 1495 239 V340 H1240 Z" fill="#16a34a"/>
  </g>
  <circle cx="1258" cy="245" r="14" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
