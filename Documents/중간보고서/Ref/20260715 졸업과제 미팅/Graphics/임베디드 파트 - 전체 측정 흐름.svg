  <circle cx="678" cy="613" r="5" fill="#ea580c"/>
  <text x="695" y="620" class="kr body">노드 상태 관리</text>
  <circle cx="678" cy="662" r="5" fill="#ea580c"/>
  <text x="695" y="669" class="kr body">서버용 JSON 생성</text>
  <rect x="678" y="720" width="199" height="45" rx="12" fill="#ffedd5"/>
  <text x="777" y="749" text-anchor="middle" class="kr output-label" fill="#c2410c">출력: JSON Snapshot</text>

  <!-- 4. Bridge -->
  <g filter="url(#shadow)">
