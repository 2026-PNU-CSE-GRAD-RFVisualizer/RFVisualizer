  <text x="1367" y="294" text-anchor="middle" class="kr box-subtitle">+ Backend</text>

  <g transform="translate(1367 420)" fill="none" stroke="#16a34a" stroke-width="7">
    <ellipse cx="0" cy="-44" rx="62" ry="23"/>
    <path d="M-62 -44 V38 C-62 50 -34 60 0 60 C34 60 62 50 62 38 V-44"/>
    <path d="M-62 -2 C-62 10 -34 20 0 20 C34 20 62 10 62 -2"/>
  </g>

  <circle cx="1268" cy="515" r="5" fill="#16a34a"/>
  <text x="1285" y="522" class="kr body">측정값 수집·검증</text>
  <circle cx="1268" cy="564" r="5" fill="#16a34a"/>
  <text x="1285" y="571" class="kr body">시간 구간별 값 묶기</text>
  <circle cx="1268" cy="613" r="5" fill="#16a34a"/>
  <text x="1285" y="620" class="kr body">데이터베이스 저장</text>
  <circle cx="1268" cy="662" r="5" fill="#16a34a"/>
  <text x="1285" y="669" class="kr body">대시보드·그래픽스 전달</text>
  <rect x="1268" y="720" width="199" height="45" rx="12" fill="#dcfce7"/>
  <text x="1367" y="749" text-anchor="middle" class="kr output-label" fill="#15803d">출력: 서버 수신 데이터</text>

  <!-- 6. Graphics -->
  <g filter="url(#shadow)">
    <rect x="1535" y="215" width="325" height="580" rx="24" fill="#ffffff"/>
    <path d="M1535 239 Q1535 215 1559 215 H1836 Q1860 215 1860 239 V340 H1535 Z" fill="#dc2626"/>
  </g>
  <circle cx="1553" cy="245" r="14" fill="#b91c1c" stroke="#ffffff" stroke-width="2"/>
  <text x="1553" y="251" text-anchor="middle" class="kr stage">6</text>
  <text x="1697" y="258" text-anchor="middle" class="kr box-title">Dashboard</text>
  <text x="1697" y="294" text-anchor="middle" class="kr box-subtitle">+ Graphics</text>

  <g transform="translate(1697 420)" fill="none" stroke="#dc2626" stroke-width="7" stroke-linejoin="round">
    <rect x="-78" y="-58" width="156" height="104" rx="10"/>
    <path d="M-52 18 L-18 -12 L8 4 L46 -35"/>
    <circle cx="-52" cy="18" r="6" fill="#dc2626" stroke="none"/>
    <circle cx="-18" cy="-12" r="6" fill="#dc2626" stroke="none"/>
    <circle cx="8" cy="4" r="6" fill="#dc2626" stroke="none"/>
    <circle cx="46" cy="-35" r="6" fill="#dc2626" stroke="none"/>
    <line x1="-24" y1="68" x2="24" y2="68"/>
    <line x1="0" y1="46" x2="0" y2="68"/>
  </g>

  <circle cx="1563" cy="515" r="5" fill="#dc2626"/>
  <text x="1580" y="522" class="kr body">노드 상태 모니터링</text>
  <circle cx="1563" cy="564" r="5" fill="#dc2626"/>
  <text x="1580" y="571" class="kr body">실제 RSSI 표본 제공</text>
  <circle cx="1563" cy="613" r="5" fill="#dc2626"/>
  <text x="1580" y="620" class="kr body">3D 장면 위치에 배치</text>
  <circle cx="1563" cy="662" r="5" fill="#dc2626"/>
  <text x="1580" y="669" class="kr body">Heatmap 보정 입력</text>
  <rect x="1563" y="720" width="269" height="45" rx="12" fill="#fee2e2"/>
  <text x="1697" y="749" text-anchor="middle" class="kr output-label" fill="#b91c1c">결과: 시각화용 현실 데이터</text>

  <rect x="80" y="865" width="1760" height="145" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="126" cy="913" r="15" fill="#2563eb"/>
  <text x="158" y="921" class="kr footer-main">핵심 역할</text>
  <text x="280" y="921" class="kr footer-main">실제 신호를 측정하고 정리해, 그래픽스가 사용할 위치·시간이 포함된 RSSI 데이터로 변환</text>
  <text x="126" y="968" class="kr footer-sub">측정</text>
  <text x="196" y="968" class="kr footer-sub" fill="#94a3b8">→</text>
  <text x="236" y="968" class="kr footer-sub">수집</text>
  <text x="306" y="968" class="kr footer-sub" fill="#94a3b8">→</text>
  <text x="346" y="968" class="kr footer-sub">오류 검사·전처리</text>
  <text x="520" y="968" class="kr footer-sub" fill="#94a3b8">→</text>
  <text x="560" y="968" class="kr footer-sub">좌표 결합</text>
  <text x="665" y="968" class="kr footer-sub" fill="#94a3b8">→</text>
  <text x="705" y="968" class="kr footer-sub">서버 저장·전달</text>
  <text x="835" y="968" class="kr footer-sub" fill="#94a3b8">→</text>
  <text x="875" y="968" class="kr footer-sub">그래픽스 입력</text>
