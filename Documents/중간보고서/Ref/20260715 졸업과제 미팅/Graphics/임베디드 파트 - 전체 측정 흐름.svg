<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <style>
      .kr { font-family: 'Noto Sans CJK KR', 'Noto Sans KR', sans-serif; }
      .title { font-size: 46px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 23px; font-weight: 400; fill: #64748b; }
      .box-title { font-size: 24px; font-weight: 700; fill: #ffffff; }
      .box-subtitle { font-size: 18px; font-weight: 500; fill: #ffffff; opacity: 0.9; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .output-label { font-size: 17px; font-weight: 700; }
      .arrow-label { font-size: 15px; font-weight: 700; fill: #475569; }
      .stage { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .footer-main { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .footer-sub { font-size: 18px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1920" height="14" fill="#2563eb"/>

  <text x="80" y="92" class="kr title">임베디드 파트 전체 측정 흐름</text>
  <text x="82" y="135" class="kr subtitle">실제 RSSI 측정값이 서버를 거쳐 그래픽스 입력으로 전달되는 과정</text>

  <line x1="315" y1="506" x2="349" y2="506" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="506" x2="644" y2="506" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="905" y1="506" x2="939" y2="506" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1200" y1="506" x2="1234" y2="506" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1495" y1="506" x2="1529" y2="506" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="286" y="165" width="92" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="589" y="165" width="76" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="873" y="165" width="98" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="1177" y="165" width="80" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <rect x="1449" y="165" width="126" height="34" rx="17" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="332" y="188" text-anchor="middle" class="kr arrow-label">ESP-NOW</text>
  <text x="627" y="188" text-anchor="middle" class="kr arrow-label">UART</text>
  <text x="922" y="188" text-anchor="middle" class="kr arrow-label">USB Serial</text>
  <text x="1217" y="188" text-anchor="middle" class="kr arrow-label">MQTT</text>
  <text x="1512" y="188" text-anchor="middle" class="kr arrow-label">DB·WebSocket</text>

  <!-- 1. ESP32 nodes -->
  <g filter="url(#shadow)">
    <rect x="60" y="215" width="255" height="580" rx="24" fill="#ffffff"/>
    <path d="M60 239 Q60 215 84 215 H291 Q315 215 315 239 V340 H60 Z" fill="#2563eb"/>
  </g>
  <circle cx="78" cy="245" r="14" fill="#1d4ed8" stroke="#ffffff" stroke-width="2"/>
  <text x="78" y="251" text-anchor="middle" class="kr stage">1</text>
  <text x="187" y="266" text-anchor="middle" class="kr box-title">ESP32 원격 노드</text>
  <text x="187" y="300" text-anchor="middle" class="kr box-subtitle">RSSI Node 1~4</text>

  <g transform="translate(187 390)" stroke="#2563eb" fill="none" stroke-width="8" stroke-linecap="round">
    <path d="M-54 0 Q0 -48 54 0"/>
    <path d="M-36 24 Q0 -8 36 24"/>
    <path d="M-16 48 Q0 34 16 48"/>
    <circle cx="0" cy="66" r="6" fill="#2563eb" stroke="none"/>
  </g>

  <circle cx="88" cy="515" r="5" fill="#2563eb"/>
  <text x="105" y="522" class="kr body">대상 AP RSSI 측정</text>
  <circle cx="88" cy="564" r="5" fill="#2563eb"/>
  <text x="105" y="571" class="kr body">5개 샘플 이동평균</text>
  <circle cx="88" cy="613" r="5" fill="#2563eb"/>
  <text x="105" y="620" class="kr body">노드 ID·순번 생성</text>
  <circle cx="88" cy="662" r="5" fill="#2563eb"/>
  <text x="105" y="669" class="kr body">상태·오류 정보 포함</text>
  <rect x="88" y="720" width="199" height="45" rx="12" fill="#dbeafe"/>
  <text x="187" y="749" text-anchor="middle" class="kr output-label" fill="#1d4ed8">출력: RSSI 패킷</text>

  <!-- 2. Gateway -->
  <g filter="url(#shadow)">
    <rect x="355" y="215" width="255" height="580" rx="24" fill="#ffffff"/>
    <path d="M355 239 Q355 215 379 215 H586 Q610 215 610 239 V340 H355 Z" fill="#0891b2"/>
  </g>
  <circle cx="373" cy="245" r="14" fill="#0e7490" stroke="#ffffff" stroke-width="2"/>
  <text x="373" y="251" text-anchor="middle" class="kr stage">2</text>
  <text x="492" y="258" text-anchor="middle" class="kr box-title">ESP32 Gateway</text>
  <text x="492" y="294" text-anchor="middle" class="kr box-subtitle">+ Local Node 5</text>

  <g transform="translate(482 415)" fill="none" stroke="#0891b2" stroke-width="7" stroke-linecap="round">
    <circle cx="0" cy="0" r="35"/>
    <circle cx="-64" cy="-18" r="14"/>
    <circle cx="64" cy="-18" r="14"/>
    <circle cx="0" cy="-70" r="14"/>
    <line x1="-51" y1="-13" x2="-31" y2="-5"/>
    <line x1="51" y1="-13" x2="31" y2="-5"/>
    <line x1="0" y1="-56" x2="0" y2="-35"/>
  </g>

  <circle cx="383" cy="515" r="5" fill="#0891b2"/>
  <text x="400" y="522" class="kr body">원격 노드 값 수집</text>
  <circle cx="383" cy="564" r="5" fill="#0891b2"/>
  <text x="400" y="571" class="kr body">CRC·중복·누락 확인</text>
  <circle cx="383" cy="613" r="5" fill="#0891b2"/>
  <text x="400" y="620" class="kr body">노드별 최신값 관리</text>
  <circle cx="383" cy="662" r="5" fill="#0891b2"/>
