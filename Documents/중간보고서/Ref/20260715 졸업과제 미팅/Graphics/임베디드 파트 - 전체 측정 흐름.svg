    <rect x="-22" y="-22" width="44" height="44" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="5"/>
    <g stroke="#ea580c" stroke-width="5">
      <line x1="-65" y1="-30" x2="-47" y2="-30"/><line x1="-65" y1="0" x2="-47" y2="0"/><line x1="-65" y1="30" x2="-47" y2="30"/>
      <line x1="47" y1="-30" x2="65" y2="-30"/><line x1="47" y1="0" x2="65" y2="0"/><line x1="47" y1="30" x2="65" y2="30"/>
      <line x1="-30" y1="-65" x2="-30" y2="-47"/><line x1="0" y1="-65" x2="0" y2="-47"/><line x1="30" y1="-65" x2="30" y2="-47"/>
      <line x1="-30" y1="47" x2="-30" y2="65"/><line x1="0" y1="47" x2="0" y2="65"/><line x1="30" y1="47" x2="30" y2="65"/>
    </g>
