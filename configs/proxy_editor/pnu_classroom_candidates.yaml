schema_version: "1.0"
warning: "All sizes are UI placeholders, not classroom measurements."

candidates:
  - id: desk_cluster
    label: Desk Cluster
    geometry: {type: box, default_size_m: [2.0, 0.8, 0.75]}
    anchor:
      mode: floor_at_xy
      floor_contact_policy: {type: minimum_bottom_vertex_clearance, clearance_m: 0.01}
    material: {category: wood}
    metadata: {semantic_class: desk_cluster, purpose: classroom_proxy, physical_object: true, confidence: unset}

  - id: blackboard_panel
    label: Blackboard Panel
    geometry: {type: thin_panel, default_size_m: [0.05, 3.0, 1.2]}
    anchor: {mode: center}
    material: {category: metal}
    metadata: {semantic_class: blackboard, purpose: classroom_proxy, physical_object: true, confidence: unset}

  - id: door_panel
    label: Door Panel
    geometry: {type: thin_panel, default_size_m: [0.05, 0.9, 2.0]}
    anchor: {mode: bottom_center}
    material: {category: wood}
    metadata: {semantic_class: door, purpose: classroom_proxy, physical_object: true, confidence: unset}

  - id: stair_step
    label: Stair Step
    geometry: {type: box, default_size_m: [1.0, 0.35, 0.15]}
    anchor: {mode: bottom_center}
    material: {category: concrete}
    metadata: {semantic_class: stair_step, purpose: stepped_floor_proxy, physical_object: true, confidence: unset}

  - id: ap_tx
    label: AP / TX
    geometry: {type: box, default_size_m: [0.25, 0.18, 0.05]}
    anchor: {mode: center}
    material: {category: wood}
    transmitter: {frequency_hz: 2400000000, power_dbm: 20.0}
    metadata: {semantic_class: access_point, purpose: rf_transmitter, physical_object: true, confidence: unset}

  - id: large_metal_object
    label: Large Metal Object
    geometry: {type: box, default_size_m: [1.0, 0.8, 1.8]}
    anchor:
      mode: floor_at_xy
      floor_contact_policy: {type: minimum_bottom_vertex_clearance, clearance_m: 0.01}
    material: {category: metal}
    metadata: {semantic_class: large_equipment, purpose: classroom_proxy, physical_object: true, confidence: unset}

  - id: custom_box
    label: Custom Box
    geometry: {type: box, default_size_m: [1.0, 1.0, 1.0]}
    anchor:
      mode: floor_at_xy
      floor_contact_policy: {type: minimum_bottom_vertex_clearance, clearance_m: 0.01}
    material: {category: concrete}
    metadata: {semantic_class: custom_box, purpose: classroom_proxy, physical_object: true, confidence: unset}

  - id: custom_thin_panel
    label: Custom Thin Panel
    geometry: {type: thin_panel, default_size_m: [0.05, 1.0, 1.0]}
    anchor: {mode: center}
    material: {category: glass}
    metadata: {semantic_class: custom_panel, purpose: classroom_proxy, physical_object: true, confidence: unset}
